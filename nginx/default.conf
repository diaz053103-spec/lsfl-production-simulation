server {
    listen 10000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass https://lsfl-api.onrender.com/api/;
        proxy_ssl_server_name on;
        proxy_ssl_name lsfl-api.onrender.com;
        proxy_set_header Host lsfl-api.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
