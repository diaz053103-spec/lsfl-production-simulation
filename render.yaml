services:
  - type: web
    name: lsfl-api
    runtime: docker
    plan: free
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/tickets
    envVars:
      - key: PORT
        value: "10000"
      - key: PORTAL_HEALTH_URL
        value: https://lsfl-dashboard.onrender.com/

  - type: web
    name: lsfl-dashboard
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "10000"
      - key: API_HOSTPORT
        fromService:
          type: web
          name: lsfl-api
          property: hostport
