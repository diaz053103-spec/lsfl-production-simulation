services:
  web:
    build: .
    environment:
      API_ORIGIN: http://api:8000
    container_name: lsfl-customer-portal
    ports:
      - "8080:80"
    restart: unless-stopped
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  api:
    image: python:3.12-alpine
    container_name: lsfl-operations-api
    command: ["python", "-u", "/app/server.py"]
    environment:
      PORT: "8000"
      PORTAL_HEALTH_URL: http://web/
    restart: unless-stopped
    volumes:
      - ./api/server.py:/app/server.py:ro
      - ./automation/ticketing/tickets.json:/data/tickets.json:ro
      - ./docs:/docs:ro
      - ./runbooks:/runbooks:ro
      - ./postmortems:/postmortems:ro
      - ./automation/failures/evidence:/evidence:ro
